<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghostbox</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
/* Base layout and components. Colours come only from the theme file (themes/*.css), which
   defines the tokens below. One accent = interactive/selected; --mark = detections and
   playback; --alarm = faults. No other colours are used. */
:root{
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 3px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 var(--font);font-variant-numeric:tabular-nums}
body{display:flex;flex-direction:column}
button,select,input{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-size:12px}
.t2{color:var(--text-2)} .t3{color:var(--text-3)}

/* controls */
.btn{height:28px;padding:0 10px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--field);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--text-3)}
.btn:disabled{opacity:.4;cursor:default}
.btn.icon{width:28px;padding:0;justify-content:center}
.btn.icon svg{width:10px;height:10px;fill:currentColor}
.seg button.icon{width:28px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2)}
.seg button.icon:hover{color:var(--text)}
.seg button.icon svg{height:10px;width:auto;fill:currentColor}
.seg button:disabled{opacity:.4;cursor:default}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.seg{display:inline-flex}
.seg button{height:28px;padding:0 12px;border:1px solid var(--line-strong);background:var(--field);cursor:pointer;color:var(--text-2);margin-left:-1px}
.seg button:first-child{border-radius:var(--radius) 0 0 var(--radius);margin-left:0}
.seg button:last-child{border-radius:0 var(--radius) var(--radius) 0}
.seg button.on{border-color:var(--accent);color:var(--accent);position:relative;z-index:1}
select.sel,input.field{height:28px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--field);padding:0 8px;outline:none}
select.sel{appearance:none;-webkit-appearance:none;padding-right:24px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-2) 50%),linear-gradient(135deg,var(--text-2) 50%,transparent 50%);
  background-position:calc(100% - 13px) 12px,calc(100% - 9px) 12px;background-size:4px 4px;background-repeat:no-repeat}
input.field:focus,select.sel:focus{border-color:var(--accent)}
input.field.freq{width:96px;font-family:var(--mono);text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:18px;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,var(--text-2) var(--fill,50%),var(--line-strong) var(--fill,50%))}
input[type=range]::-moz-range-track{height:2px;background:var(--line-strong)}
input[type=range]::-moz-range-progress{height:2px;background:var(--text-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:14px;border-radius:2px;background:var(--text);margin-top:-6px;border:1px solid var(--bg)}
input[type=range]::-moz-range-thumb{width:10px;height:14px;border-radius:2px;background:var(--text);border:1px solid var(--bg)}
input[type=range]:focus{outline:none}
input[type=range]:focus::-webkit-slider-thumb{background:var(--accent)}
/* checkbox (kept as .switch so the script doesn't care) */
.switch{position:relative;display:inline-flex;width:14px;height:14px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{width:14px;height:14px;border:1px solid var(--line-strong);border-radius:2px;background:var(--field);pointer-events:none}
.switch input:checked+span{background:var(--accent);border-color:var(--accent)}
.switch input:checked+span:after{content:"";display:block;width:4px;height:8px;margin:1px 0 0 4px;border:solid var(--accent-text);border-width:0 2px 2px 0;transform:rotate(45deg)}
.switch input:focus-visible+span{outline:1px solid var(--accent);outline-offset:1px}

/* top bar */
#top{display:flex;align-items:center;gap:6px;padding:0 12px;height:46px;flex:none;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:nowrap;overflow:hidden}
#top>*{flex-shrink:0}
#dot{width:8px;height:8px;border-radius:50%;background:var(--text-3);flex:none;margin-right:4px}
#dot.ok{background:var(--ok)} #dot.bad{background:var(--alarm)}
.grp{display:flex;align-items:center;gap:6px;padding:0 8px;border-left:1px solid var(--line)}
.grp:first-of-type{border-left:0;padding-left:0}
.grp label,.unit{color:var(--text-2);font-size:12px}
.gainval{font-family:var(--mono);font-size:12px;min-width:40px;color:var(--text-2)}
#status{font-family:var(--mono);font-size:11.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  flex:1 1 0 !important;min-width:0;text-align:right;padding:0 4px}   /* fills the gap; long messages are cut, never push */
#status.bad{color:var(--alarm)}

/* layout */
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
#left{display:flex;flex-direction:column;min-width:0;min-height:0}
#wfbar{display:flex;align-items:center;gap:8px;padding:0 12px;height:40px;flex:none;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:nowrap;overflow:hidden;white-space:nowrap}
#wfbar .lbl{color:var(--text-2);font-size:12px}
#wfbar input[type=range]{width:72px}
#wfwrap{position:relative;flex:1;min-height:280px;overflow:hidden;background:var(--wf-bg)}
canvas#wf{position:absolute;inset:0;width:100%;height:100%;display:block}
#scopeWrap{border-top:1px solid var(--line);background:var(--panel);position:relative}
#scopeCap{position:absolute;left:10px;top:4px;right:10px;font-size:11.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;z-index:1}
canvas#scope{display:block;width:100%;height:96px;margin-top:20px}
.btn.icon svg{width:10px;height:10px;fill:currentColor}
#tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--text);border:1px solid var(--line-strong);padding:3px 6px;border-radius:var(--radius);font:11px var(--mono);display:none;white-space:nowrap}

#side{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;padding:0 12px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 10px 9px;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.active{color:var(--text);border-bottom-color:var(--accent)}
.tab{display:none;overflow-y:auto;flex:1;min-height:0}
.tab.active{display:block}
.pad{padding:4px 14px 20px}
h2{font-size:12px;font-weight:600;color:var(--text);margin:20px 0 8px}

/* detections table: one line each */
.dethead,.det{display:grid;grid-template-columns:26px 82px 60px minmax(0,1fr) 30px 20px;align-items:center;gap:8px;padding:0 12px 0 10px}
.dethead{height:28px;font-size:11px;color:var(--text-3);border-bottom:1px solid var(--line)}
.dethead span:last-child{text-align:right}
.det{position:relative;height:34px;border-bottom:1px solid var(--line);cursor:pointer;
  background:
    linear-gradient(90deg,color-mix(in srgb,var(--mark) 30%,transparent) var(--p,0%),transparent var(--p,0%)),
    linear-gradient(90deg,color-mix(in srgb,var(--mark) var(--ca,5%),transparent),color-mix(in srgb,var(--mark) var(--cb,2%),transparent))}
.det::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--mark);opacity:var(--a,.2)}
.det:hover{background-color:var(--hover)}
.det .play{width:22px;height:22px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--field);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:var(--text-2)}
.det .play svg{width:8px;height:8px;fill:currentColor}
.det .play:hover{border-color:var(--text-3);color:var(--text)}
.det .play.on{border-color:var(--mark);color:var(--mark)}
.det .f{font-family:var(--mono);font-size:12px}
.det .t{font-family:var(--mono);font-size:12px;color:var(--text-2);white-space:nowrap}
.det .x{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.det .x.none{color:var(--text-3)}
.det .x.doubt{color:var(--text-2)}
.det .c{font-family:var(--mono);font-size:11.5px;color:var(--text-2);text-align:right}
.det.hi .c{color:var(--mark)}
.det .sv{width:20px;height:20px;border:0;background:none;padding:0;cursor:pointer;color:var(--text-3);display:flex;align-items:center;justify-content:center}
.det .sv svg{width:11px;height:11px}
.det .sv:hover{color:var(--text)}
.det .sv.done{cursor:default;color:var(--text-3)}
.det .live{position:absolute;left:3px;top:50%;transform:translateY(-50%);width:4px;height:4px;border-radius:50%;background:var(--alarm)}
#detHead{display:flex;align-items:center;gap:12px;padding:8px 12px}
.search{flex:1;min-width:0;height:26px;border:0;border-bottom:1px solid var(--line-strong);background:transparent;padding:0 2px;outline:none;color:var(--text)}
.search:focus{border-bottom-color:var(--accent)}
.search::placeholder{color:var(--text-3)}

/* settings */
.row{display:grid;grid-template-columns:minmax(0,1fr) 120px 70px;align-items:center;gap:10px;min-height:28px}
.row>label{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row output{font-family:var(--mono);font-size:12px;text-align:right;white-space:nowrap}
.row.wide{grid-template-columns:minmax(0,1fr) 200px}
.row.wide select,.row.wide input.field{width:100%}
.card{border-top:1px solid var(--line);padding:10px 0 8px}
.card.off .desc,.card.off .row{opacity:.5}
.card .hd{display:flex;align-items:center;gap:8px;font-weight:600}
.card .hd .tag{margin-left:auto;font-size:11px;font-weight:400;color:var(--text-3)}
.card .desc{color:var(--text-2);font-size:12px;margin:3px 0 6px}
.note{color:var(--text-3);font-size:12px;margin:8px 0}
#survey{position:absolute;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;padding:10px 14px;gap:6px;overflow:auto}
.svhead{display:flex;align-items:center;gap:12px;height:30px;flex-wrap:nowrap}
.svhead>*{flex-shrink:0}
#svInfo,#svStatus{flex-shrink:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#svInfo{flex-shrink:2}
.svmapwrap{position:relative}
.svmap{display:block;width:100%;height:220px;touch-action:none;background:var(--wf-bg);cursor:crosshair;border:1px solid var(--line)}
.svaxis{position:relative;height:16px;font:11px var(--mono);color:var(--text-3)}
.svaxis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.svchart{display:block;width:100%;height:64px;cursor:crosshair}
.svtip{position:absolute;top:6px;display:none;background:var(--panel);border:1px solid var(--line-strong);padding:3px 7px;font-size:12px;pointer-events:none;white-space:nowrap;border-radius:var(--radius)}
.svsamples h3{font-size:12px;font-weight:600;color:var(--text-2);margin:8px 0 4px}
.svrow.det{display:grid;grid-template-columns:24px 120px minmax(0,1fr) 90px 44px;gap:10px;align-items:center;padding:3px 0;border-top:1px solid var(--line);cursor:pointer}
.svrow:hover{background:var(--hover)}
.svrow .t2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.svrow .btn{height:22px}
#newSurvey{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:14vh 16px}
#helpWrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
.help{width:min(720px,100%);line-height:1.5}
.help p{margin:6px 0}
.help ul{margin:6px 0;padding-left:18px}
.help li{margin:4px 0}
.help code{font:12px var(--mono);background:var(--field);padding:1px 4px;border-radius:var(--radius);overflow-wrap:anywhere}
.helpstep{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;margin-top:14px}
.helpstep h3{font-size:13.5px;margin:2px 0 2px}
.helpn{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-2)}
#detail{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.dlg{width:min(900px,100%);background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--radius);padding:14px 16px 16px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.dlghead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:28px}
.dlgtx{font-size:16px;line-height:1.45;margin:12px 0 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.dlgplayer{margin-top:12px}
.dlgplot{position:relative;cursor:pointer}
.dlgwave{display:block;width:100%;height:64px;border:1px solid var(--line);border-bottom:0}
.dlgspec{display:block;width:100%;height:150px;border:1px solid var(--line)}
.dlgplayhead{position:absolute;top:0;bottom:0;left:0;width:1px;background:var(--text);pointer-events:none;opacity:.85}
.dlgacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.dlgacts a.btn{text-decoration:none;color:inherit}
.dlggrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:14px}
@media (max-width:700px){.dlggrid{grid-template-columns:1fr}}
.dlggrid h3{font-size:12px;font-weight:600;color:var(--text-2);margin:0 0 6px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;padding:3px 0;border-top:1px solid var(--line);font-size:12.5px}
.kv.sc{grid-template-columns:minmax(0,1fr) 90px 32px;align-items:center}
.kv .bar{height:4px;background:var(--line-strong);border-radius:2px;overflow:hidden}
.kv .bar>i{display:block;height:100%;background:var(--mark)}
.kv .num{text-align:right}
.dlgspark{display:block;width:100%;height:40px}
.abrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:10px;font-size:12px}
.abseg{display:inline-flex}
.abseg .btn{height:24px;padding:0 8px;border-radius:0;margin-left:-1px}
.abseg .btn:first-child{border-radius:var(--radius) 0 0 var(--radius);margin-left:0}
.abseg .btn:last-child{border-radius:0 var(--radius) var(--radius) 0}
.abseg .btn.on{position:relative;z-index:1}
.tuneout{margin-top:10px}
.tunebest{font-size:13.5px}
.tbar{height:3px;background:var(--line-strong);border-radius:2px;overflow:hidden}
.tbar>i{display:block;height:100%;width:0;background:var(--accent);transition:width 1s linear}
.err{color:var(--alarm);font-size:12px}
@media (max-width:980px){main{grid-template-columns:1fr;grid-template-rows:58vh auto}#side{border-left:0;border-top:1px solid var(--line);min-height:70vh}
  #top,#wfbar{height:auto;min-height:46px;flex-wrap:wrap;padding:6px 12px}#status{flex-basis:100% !important;text-align:left}}
</style>
<link id="themeCss" rel="stylesheet" href="/static/themes/instrument.css">
<script>
/* The one list of themes (file name, label). Loaded before first paint so there's no flash. */
window.GB_THEMES=[["instrument","Instrument"],["studio","Studio"],["editor","Editor"],["dimmed","Dimmed"],
  ["gruvbox","Gruvbox"],["solarized-dark","Solarized Dark"],["solarized-light","Solarized Light"],
  ["daylight","Daylight"],["bench","Bench"],["nightvision","Night vision (red)"]];
try{var t=localStorage.getItem("gb_theme");if(GB_THEMES.some(function(x){return x[0]===t}))document.getElementById("themeCss").href="/static/themes/"+t+".css"}catch(e){}
</script>
</head>
<body>
<header id="top">
  <i id="dot" title="Receiver status"></i>
  <div class="grp">
    <div class="seg">
      <button id="fleft" class="icon" title="Down two window widths"><svg viewBox="0 0 12 10"><path d="M6 1 1 5l5 4zM11 1 6 5l5 4z"/></svg></button>
      <button id="left" class="icon" title="Down half a window width"><svg viewBox="0 0 10 10"><path d="M7 1 2 5l5 4z"/></svg></button>
    </div>
    <input id="freq" class="field freq" title="Centre frequency (MHz)"><span class="unit">MHz</span>
    <div class="seg">
      <button id="right" class="icon" title="Up half a window width"><svg viewBox="0 0 10 10"><path d="M3 1l5 4-5 4z"/></svg></button>
      <button id="fright" class="icon" title="Up two window widths"><svg viewBox="0 0 12 10"><path d="M1 1l5 4-5 4zM6 1l5 4-5 4z"/></svg></button>
    </div>
  </div>
  <div class="grp"><select id="rate" class="sel" title="Span: how wide a slice of spectrum is captured (= sample rate)"></select><span id="range" class="num t2"></span></div>
  <div class="grp">
    <label for="gain">Gain</label><input id="gain" type="range" min="0" max="102" step="2" style="width:100px"><span id="gainVal" class="gainval"></span>
    <button id="amp" class="btn" title="HackRF RF amplifier (+14 dB)">Amp</button>
    <button id="mapBtn" class="btn" title="Survey map: the ranges you surveyed and what the detector found there">Map</button>
  </div>
  <span id="status">Connecting…</span>
  <div class="grp">
    <button id="pp" class="btn icon" title="Pause playback (Space)"><svg viewBox="0 0 8 8"><path d="M1.2 1h2v6h-2zM4.8 1h2v6h-2z"/></svg></button>
    <input id="vol" type="range" min="0" max="1.5" step="0.05" value="0.9" style="width:72px" title="Volume">
    <button id="helpBtn" class="btn icon" title="How to use this">?</button>
  </div>
</header>
<main>
  <section id="left">
    <div id="wfbar">
      <select id="view" class="sel" title="What the waterfall shows"></select>
      <select id="cmap" class="sel" title="Colour map"><option value="rainbow">Rainbow (SDR#)</option><option value="turbo">Turbo</option><option value="inferno">Inferno</option><option value="magma">Magma</option><option value="viridis">Viridis</option><option value="gray">Greyscale</option><option value="amber">Amber phosphor</option><option value="green">Green phosphor</option><option value="red">Red (night)</option></select>
      <span class="lbl" style="margin-left:6px">Min confidence</span><input id="minConf" type="range" min="0" max="100" step="1" style="width:120px"><span id="minConfOut" class="num t2" style="min-width:34px"></span>
      <label class="lbl" style="display:flex;align-items:center;gap:6px"><span class="switch"><input id="caps" type="checkbox" checked><span></span></span>Captions</label>
    </div>
    <div id="wfwrap">
      <canvas id="wf"></canvas><div id="tip"></div>
      <div id="nav" style="position:absolute;right:12px;bottom:12px;display:flex;gap:6px">
        <button id="followBtn" class="btn" style="display:none">Follow playhead</button>
        <button id="liveBtn" class="btn primary" style="display:none">Return to live</button>
      </div>
    </div>
    <div id="scopeWrap">
      <div id="scopeCap"></div>
      <canvas id="scope"></canvas>
    </div>
  </section>
  <aside id="side">
    <div class="tabs">
      <button data-tab="dets" class="active">Detections</button>
      <button data-tab="detector">Detector</button>
      <button data-tab="sdr">Settings</button>
    </div>
    <div id="dets" class="tab active">
      <div id="detHead"><span class="t2" id="detCount"></span><input id="search" class="search" type="search" placeholder="Search" title="Search transcripts and frequencies" autocomplete="off"></div>
      <div class="dethead"><span></span><span>Frequency</span><span>Time</span><span>Transcript</span><span>Conf.</span><span></span></div>
      <div id="liveList"></div><div id="savedList"></div><div id="listMore" class="note" style="text-align:center"></div>
    </div>
    <div id="detector" class="tab pad"></div>
    <div id="sdr" class="tab pad"></div>
  </aside>
</main>
<script src="/static/app.js"></script>
</body>
</html>
