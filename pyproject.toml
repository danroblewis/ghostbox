[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ghostbox"
version = "0.1.0"
description = "SDR-native spirit box: the raw spectrum of a whole band of IQ from a HackRF or RTL-SDR, as a live waterfall you can listen into, in a web UI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["sdr", "hackrf", "rtl-sdr", "spirit box", "iq", "waterfall"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
# Everything the default settings use: the engine and web server (numpy, scipy, aiohttp) and
# Whisper transcription (faster-whisper). Other speech engines are extras.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "aiohttp>=3.9",
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
# Moonshine and wav2vec2 speech recognition.
transformers = ["torch>=2.1", "transformers>=4.48"]
# Vosk speech recognition.
vosk = ["vosk>=0.3.44,!=0.3.45"]   # 0.3.45 has no macOS wheels
# Kept so older install commands still work (these are now standard dependencies).
vad = []
whisper = []
recommended = []
all = ["ghostbox[transformers,vosk]"]

[project.scripts]
ghostbox = "ghostbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ghostbox"]

[tool.hatch.build.targets.sdist]
include = ["/ghostbox", "/README.md", "/pyproject.toml", "/LICENSE"]
exclude = ["__pycache__", "*.pyc"]
